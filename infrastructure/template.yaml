AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  between-sessions-backend
  Serverless backend for Between Sessions — single-table DynamoDB, JWT auth, Cedar policies.

Parameters:
  JwtSecret:
    Type: String
    NoEcho: true
    Description: "Cryptographic secret key for signing and verifying production JWT authentication tokens."
    MinLength: 32
  AiProvider:
    Type: String
    Default: "mock"
    Description: "AI provider selection for clinician decision support (mock for first deployment)"
    AllowedValues:
      - "mock"
      - "huggingface"
  EmailProvider:
    Type: String
    Default: "mock"
    Description: "Email delivery provider mode (mock for staging, ses for Amazon SES, mailtrap for sandbox)"
    AllowedValues:
      - "mock"
      - "ses"
      - "mailtrap"
  SesFromEmail:
    Type: String
    Default: "sanctuary@betweensessions.com"
    Description: "Verified sender email address configured in Amazon SES"
  FrontendOrigin:
    Type: String
    Default: "https://main.d22m0ipcsise4e.amplifyapp.com"
    Description: "Allowed CORS frontend origin (Amplify production domain)"
  HfApiKey:
    Type: String
    NoEcho: true
    Default: ""
    Description: "Hugging Face Inference API token for clinical AI decision support"
  HfModel:
    Type: String
    Default: "meta-llama/Llama-3.1-8B-Instruct"
    Description: "Hugging Face model repository identifier"

Globals:
  Function:
    Runtime: nodejs22.x
    Timeout: 30
    MemorySize: 256
    Architectures:
      - x86_64
    Tracing: Active
    Environment:
      Variables:
        TABLE_NAME: !Ref MainTable
        JWT_SECRET: !Ref JwtSecret
        AI_PROVIDER: !Ref AiProvider
        EMAIL_PROVIDER: !Ref EmailProvider
        SES_FROM_EMAIL: !Ref SesFromEmail
        ALLOWED_ORIGIN: !Ref FrontendOrigin
        APP_BASE_URL: !Ref FrontendOrigin
        APP_URL: !Ref FrontendOrigin
        HF_TOKEN: !Ref HfApiKey
        HF_API_KEY: !Ref HfApiKey
        HF_MODEL: !Ref HfModel
  Api:
    Cors:
      AllowMethods: "'GET,POST,PUT,DELETE,OPTIONS'"
      AllowHeaders: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'"
      AllowOrigin: !Sub "'${FrontendOrigin}'"
    MethodSettings:
      - ResourcePath: "/*"
        HttpMethod: "*"
        ThrottlingRateLimit: 50
        ThrottlingBurstLimit: 100

Resources:

  # ── DynamoDB Single Table ────────────────────────────────────────────────────
  MainTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: BetweenSessionsTable
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      SSESpecification:
        SSEEnabled: true

  # ── Auth & User ──────────────────────────────────────────────────────────────
  AuthFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/src/
      Handler: auth.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref MainTable
        - Statement:
            - Effect: Allow
              Action:
                - ses:SendEmail
                - ses:SendRawEmail
              Resource: "*"
      Events:
        Root:
          Type: Api
          Properties:
            Path: /
            Method: get
        ApiV1Root:
          Type: Api
          Properties:
            Path: /api/v1
            Method: get
        HealthCheck:
          Type: Api
          Properties:
            Path: /api/health
            Method: get
        Register:
          Type: Api
          Properties:
            Path: /api/v1/auth/register
            Method: post
        Login:
          Type: Api
          Properties:
            Path: /api/v1/auth/login
            Method: post
        VerifyEmail:
          Type: Api
          Properties:
            Path: /api/v1/auth/verify
            Method: post
        ResendVerification:
          Type: Api
          Properties:
            Path: /api/v1/auth/resend
            Method: post
        ForgotPassword:
          Type: Api
          Properties:
            Path: /api/v1/auth/forgot-password
            Method: post
        ResetPassword:
          Type: Api
          Properties:
            Path: /api/v1/auth/reset-password
            Method: post
        UpdateUser:
          Type: Api
          Properties:
            Path: /api/v1/user/update
            Method: put
        UpdateUserPost:
          Type: Api
          Properties:
            Path: /api/v1/user/update
            Method: post
        PractitionerLogin:
          Type: Api
          Properties:
            Path: /api/v1/auth/practitioner-login
            Method: post
        PractitionerRegister:
          Type: Api
          Properties:
            Path: /api/v1/auth/practitioner-register
            Method: post

  # ── Checkins ─────────────────────────────────────────────────────────────────
  CheckinsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/src/
      Handler: checkins.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref MainTable
      Events:
        CreateCheckin:
          Type: Api
          Properties:
            Path: /api/v1/checkins
            Method: post
        GetCheckins:
          Type: Api
          Properties:
            Path: /api/v1/checkins
            Method: get

  # ── Journal ──────────────────────────────────────────────────────────────────
  JournalFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/src/
      Handler: journal.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref MainTable
      Events:
        CreateJournal:
          Type: Api
          Properties:
            Path: /api/v1/journal
            Method: post
        GetJournal:
          Type: Api
          Properties:
            Path: /api/v1/journal
            Method: get

  # ── Practice (legacy behavioral events) ─────────────────────────────────────
  PracticeFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/src/
      Handler: practice.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref MainTable
      Events:
        LogPractice:
          Type: Api
          Properties:
            Path: /api/v1/practice
            Method: post
        GetPractice:
          Type: Api
          Properties:
            Path: /api/v1/practice
            Method: get
        GetPracticePlans:
          Type: Api
          Properties:
            Path: /api/v1/practice/plans
            Method: get

  # ── Dashboard ────────────────────────────────────────────────────────────────
  DashboardFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/src/
      Handler: dashboard.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref MainTable
      Events:
        GetDashboard:
          Type: Api
          Properties:
            Path: /api/v1/dashboard
            Method: get

  # ── Progress ─────────────────────────────────────────────────────────────────
  ProgressFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/src/
      Handler: progress.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref MainTable
      Events:
        GetProgress:
          Type: Api
          Properties:
            Path: /api/v1/progress
            Method: get

  # ── AI Weekly Summary ────────────────────────────────────────────────────────
  AiSummaryFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/src/
      Handler: aiSummary.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref MainTable
      Events:
        GenerateSummary:
          Type: Api
          Properties:
            Path: /api/v1/ai/weekly-summary
            Method: post
        GetSummary:
          Type: Api
          Properties:
            Path: /api/v1/ai/weekly-summary
            Method: get

  # ── Consents ─────────────────────────────────────────────────────────────────
  ConsentsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/src/
      Handler: consents.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref MainTable
      Events:
        GetConsents:
          Type: Api
          Properties:
            Path: /api/v1/consents
            Method: get
        UpdateConsent:
          Type: Api
          Properties:
            Path: /api/v1/consents/{consentId}
            Method: put
        CreateConsent:
          Type: Api
          Properties:
            Path: /api/v1/consents
            Method: put

  # ── Connections ──────────────────────────────────────────────────────────────
  ConnectionsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/src/
      Handler: connections.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref MainTable
      Events:
        CreateConnection:
          Type: Api
          Properties:
            Path: /api/v1/connections
            Method: post
        GetConnections:
          Type: Api
          Properties:
            Path: /api/v1/connections
            Method: get
        DeleteConnection:
          Type: Api
          Properties:
            Path: /api/v1/connections/{id}
            Method: delete
        CedarEval:
          Type: Api
          Properties:
            Path: /api/v1/connections/cedar-eval
            Method: get
        GetRecommendations:
          Type: Api
          Properties:
            Path: /api/v1/recommendations
            Method: get

  # ── Practitioner (Cedar auth demo) ───────────────────────────────────────────
  PractitionerFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/src/
      Handler: practitioner.handler
      MemorySize: 512
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref MainTable
      Events:
        GetPatientSummary:
          Type: Api
          Properties:
            Path: /api/v1/practitioner/patients/{userId}/summary
            Method: get
        GetPatients:
          Type: Api
          Properties:
            Path: /api/v1/practitioner/patients
            Method: get
        GetPractitioners:
          Type: Api
          Properties:
            Path: /api/v1/practitioners
            Method: get
        GetPractitionerMe:
          Type: Api
          Properties:
            Path: /api/v1/practitioner/me
            Method: get
        UpdatePractitionerMe:
          Type: Api
          Properties:
            Path: /api/v1/practitioner/me
            Method: put
        GetRequests:
          Type: Api
          Properties:
            Path: /api/v1/practitioner/requests
            Method: get
        AcceptRequest:
          Type: Api
          Properties:
            Path: /api/v1/practitioner/requests/{userId}/accept
            Method: post
        DeclineRequest:
          Type: Api
          Properties:
            Path: /api/v1/practitioner/requests/{userId}/decline
            Method: post
        GetPatientConsent:
          Type: Api
          Properties:
            Path: /api/v1/practitioner/patients/{userId}/consent
            Method: get
        CreateRecommendation:
          Type: Api
          Properties:
            Path: /api/v1/practitioner/patients/{userId}/recommendations
            Method: post
        GeneratePatientAiSummary:
          Type: Api
          Properties:
            Path: /api/v1/practitioner/patients/{userId}/ai-summary
            Method: post

  # ── Toolkit (Grounding, Breathing, Pause&Choose, Reassurance, Focus) ─────────
  ToolkitFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/src/
      Handler: toolkit.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref MainTable
      Events:
        CreateInteraction:
          Type: Api
          Properties:
            Path: /api/v1/toolkit/interactions
            Method: post
        GetInteractions:
          Type: Api
          Properties:
            Path: /api/v1/toolkit/interactions
            Method: get

  # ── Values & Life Outside OCD ────────────────────────────────────────────────
  ValuesFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/src/
      Handler: values.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref MainTable
      Events:
        GetValues:
          Type: Api
          Properties:
            Path: /api/v1/values
            Method: get
        GetValuesActions:
          Type: Api
          Properties:
            Path: /api/v1/values/actions
            Method: get
        CreateValuesAction:
          Type: Api
          Properties:
            Path: /api/v1/values/actions
            Method: post

  # ── Learning (Curated Educational Sanctuary) ─────────────────────────────────
  LearningFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/src/
      Handler: learning.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref MainTable
      Events:
        GetModules:
          Type: Api
          Properties:
            Path: /api/v1/learn/modules
            Method: get
        GetLearnProgress:
          Type: Api
          Properties:
            Path: /api/v1/learn/progress
            Method: get
        UpdateLearnProgress:
          Type: Api
          Properties:
            Path: /api/v1/learn/progress
            Method: post

Outputs:
  ApiBaseUrl:
    Description: "API Gateway Base URL"
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod"
  ApiEndpoint:
    Description: "API Gateway v1 endpoint URL"
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/api/v1"
  MainTableName:
    Description: "DynamoDB table name"
    Value: !Ref MainTable
